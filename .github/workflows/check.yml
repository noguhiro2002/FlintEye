name: Distribution checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c packaging/constraints.txt -r requirements.txt -r tests/requirements.txt
      - name: Backend tests, HTTP access matrix and per-operation evidence
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo -n --preserve-env=GITHUB_ACTIONS python3 packaging/ci_apt.py
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install coverage==7.17.3
          python tools/verify_before_push.py --group backend
      - name: Preserve endpoint and branch results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage-audit
          path: dist/api-coverage-audit/*.json
          if-no-files-found: error
      - name: Verify documentation and installer shell syntax
        run: python tools/verify_before_push.py --group documentation
      - run: npm ci
        working-directory: frontend
      - name: Install browser engines for synthetic WebApp regressions
        working-directory: frontend
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS python3 ../packaging/ci_apt.py
          npx playwright install --with-deps chromium firefox webkit
      - name: Production build and WebApp behavior
        run: python tools/verify_before_push.py --group frontend
      - name: Inventory Settings inputs and exercise configuration against the real API
        run: python tools/verify_before_push.py --group settings
      - name: Preserve Settings scenario results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-coverage
          path: dist/settings-coverage
          if-no-files-found: ignore
      - name: Firefox and WebKit operator workflows
        run: python tools/verify_before_push.py --group browsers
      - name: Frontend dependency audit
        run: python tools/verify_before_push.py --group dependency-audit
      - name: Container smoke tests, Compose upgrade and rollback
        run: python tools/verify_before_push.py --group containers
