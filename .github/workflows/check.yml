name: Distribution checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -c packaging/constraints.txt -r requirements.txt -r tests/requirements.txt
      - name: Backend tests, HTTP access matrix and per-operation evidence
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo -n --preserve-env=GITHUB_ACTIONS python3 packaging/ci_apt.py
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install coverage==7.17.3
          python tools/audit_api_coverage.py --require-all-operations --require-permitted-behavior --output dist/api-coverage-audit
      - name: Preserve endpoint and branch results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage-audit
          path: dist/api-coverage-audit/*.json
          if-no-files-found: error
      - run: python packaging/check_docs.py
      - run: bash -n packaging/install.sh packaging/build_vendor.sh packaging/smoke_bundle.sh
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Frontend build leaves tracked sources clean
        run: git diff --exit-code -- frontend
      - name: Install browser engines for synthetic WebApp regressions
        working-directory: frontend
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS python3 ../packaging/ci_apt.py
          npx playwright install --with-deps chromium firefox webkit
      - name: WebApp behavior and responsive layout
        working-directory: frontend
        run: npm test
      - name: Inventory Settings inputs and exercise configuration against the real API
        run: |
          (cd frontend && node tests/settings-inventory.mjs)
          python packaging/qa_settings.py dist/settings-coverage
      - name: Preserve Settings scenario results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-coverage
          path: dist/settings-coverage
          if-no-files-found: ignore
      - name: Firefox and WebKit operator workflows
        working-directory: frontend
        run: |
          for engine in firefox webkit; do
            for test in monitoring setup recordings config-revision dialog navigation; do
              FLINTEYE_BROWSER=$engine node tests/$test.mjs
            done
          done
      - run: npm run audit
        working-directory: frontend
      - run: docker build --build-arg "FLINTEYE_REVISION=$GITHUB_SHA" -t flinteye:check .
      - run: docker run --rm -i --network none --tmpfs /data:rw,uid=10001,gid=10001 --entrypoint python flinteye:check - < packaging/smoke_container.py
      - run: docker run --rm -i --network none --entrypoint python flinteye:check - --mediamtx /opt/flinteye/bin/mediamtx < packaging/smoke_private_input.py
      - name: Recording volume exhaustion and recovery
        run: docker run --rm -i --network none --tmpfs /qa-recordings:rw,size=8m,uid=10001,gid=10001 --entrypoint python flinteye:check - < packaging/smoke_storage_faults.py
      - name: Compose upgrade from preview.3 and rollback with its stopped-volume backup
        run: python packaging/smoke_compose.py --image flinteye:check --previous-image ghcr.io/noguhiro2002/flinteye:1.2.0-preview.3@sha256:445d6a85dc9c5129213ddd753b13d467a1bdc4464e307fd726f001e525b832f4
