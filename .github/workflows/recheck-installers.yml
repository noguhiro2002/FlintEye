name: Diagnose existing installers
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Completed Build release run with all four desktop builders successful
        required: true
        type: string
      target:
        type: choice
        options: [all, windows, macos]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.verify.outputs.matrix }}
      build_commit: ${{ steps.verify.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.build_run_id }}
          TARGET: ${{ inputs.target }}
        run: python packaging/recheck_installers.py --run-id "$SOURCE_RUN" --target "$TARGET"
  diagnose:
    needs: preflight
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      FLINTEYE_QA_RUNNER: ${{ matrix.runner }}
      FLINTEYE_QA_DIAGNOSTIC: '1'
      BUILD_COMMIT: ${{ needs.preflight.outputs.build_commit }}
      QA_METHOD: ${{ matrix.method }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: installer-input
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Independent OS-policy control, without launching or approving an app
        if: matrix.os == 'macos'
        run: python packaging/macos_ci_policy.py --output lifecycle-results/os-control
      - name: Validate original artifacts and stage current diagnostic scripts
        shell: bash
        run: python packaging/recheck_installers.py --overlay installer-input --commit "$BUILD_COMMIT"
      - name: Prepare independent verifier
        shell: bash
        run: |
          python -m pip install httpx==0.28.1
          npm --prefix frontend ci
          (cd frontend && npx playwright install chromium)
      - name: Recheck existing installer bytes; diagnostic results cannot be published
        shell: bash
        run: python packaging/lifecycle.py --method "$QA_METHOD" --artifact-directory installer-input --commit "$BUILD_COMMIT" --output lifecycle-results/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostic-${{ matrix.method }}-${{ matrix.runner }}
          path: |
            lifecycle-results/
            installer-input/diagnostic-inputs.json
          if-no-files-found: warn
          retention-days: 14
