name: Build release
on:
  workflow_dispatch:
    inputs:
      desktop_only:
        description: Build only Windows/macOS installers when diagnosing desktop packaging
        type: boolean
        default: false
      windows_arm_only:
        description: Diagnose only the Windows ARM64 installer
        type: boolean
        default: false
      windows_only:
        description: Build both Windows installers when diagnosing Windows packaging
        type: boolean
        default: false
      crypto_only:
        description: Diagnose Windows ARM64 crypto dependencies without compiling all media tools
        type: boolean
        default: false
      windows_stop_only:
        description: Diagnose profile-scoped Windows shutdown without compiling installers
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-release-${{ github.ref }}-${{ inputs.desktop_only }}-${{ inputs.windows_arm_only }}-${{ inputs.windows_only }}-${{ inputs.crypto_only }}-${{ inputs.windows_stop_only }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !inputs.crypto_only && !inputs.windows_stop_only }}
    uses: ./.github/workflows/check.yml

  windows_crypto:
    if: inputs.crypto_only
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: arm64
      - run: python packaging/build_windows_crypto.py
      - run: python -m pip install -c packaging/constraints.txt -r requirements.txt
      - run: python -m unittest discover -s tests -p test_network_access.py -v

  windows_stop:
    if: ${{ !inputs.crypto_only }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Profile-scoped shutdown regression (PowerShell 5.1)
        shell: powershell
        run: ./packaging/smoke_windows_stop.ps1

  desktop:
    if: ${{ !inputs.crypto_only && !inputs.windows_stop_only }}
    needs: [checks, windows_stop]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.windows_arm_only && '[
            {"os":"windows","arch":"arm64","runner":"windows-11-arm","python_arch":"arm64","msystem":"CLANGARM64","prefix":"mingw-w64-clang-aarch64","compiler":"clang"}
          ]' || inputs.windows_only && '[
            {"os":"windows","arch":"amd64","runner":"windows-2022","python_arch":"x64","msystem":"UCRT64","prefix":"mingw-w64-ucrt-x86_64","compiler":"gcc"},
            {"os":"windows","arch":"arm64","runner":"windows-11-arm","python_arch":"arm64","msystem":"CLANGARM64","prefix":"mingw-w64-clang-aarch64","compiler":"clang"}
          ]' || '[
            {"os":"windows","arch":"amd64","runner":"windows-2022","python_arch":"x64","msystem":"UCRT64","prefix":"mingw-w64-ucrt-x86_64","compiler":"gcc"},
            {"os":"windows","arch":"arm64","runner":"windows-11-arm","python_arch":"arm64","msystem":"CLANGARM64","prefix":"mingw-w64-clang-aarch64","compiler":"clang"},
            {"os":"macos","arch":"amd64","runner":"macos-15-intel","python_arch":"x64"},
            {"os":"macos","arch":"arm64","runner":"macos-15","python_arch":"arm64"}
          ]') }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows installer test preflight
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./packaging/smoke_windows_installer.ps1 -PreflightOnly
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14.10'
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build native ARM64 cryptography against verified static OpenSSL
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        run: python packaging/build_windows_crypto.py
      - name: Python packaging dependencies
        run: python -m pip install -c packaging/constraints.txt -r requirements.txt -r packaging/requirements-build.txt meson==1.9.1 ninja==1.13.0
      - name: Native process ownership and application quit checks
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_process_lifetime.py -v
          python -m unittest discover -s tests -p test_macos_lifecycle.py -v
          python -m unittest discover -s tests -p test_network_access.py -v
      - name: macOS build tools
        if: matrix.os == 'macos'
        run: brew install cmake pkg-config nasm ninja
      - name: Windows native build tools
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            make diffutils patch git
            ${{ matrix.prefix }}-${{ matrix.compiler }}
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-meson
            ${{ matrix.prefix }}-pkgconf
      - name: x64 assembler
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        shell: msys2 {0}
        run: pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-nasm
      - name: Build media tools from pinned sources (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          FLINTEYE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash packaging/build_vendor.sh
      - name: Build media tools from pinned sources (macOS)
        if: matrix.os == 'macos'
        run: bash packaging/build_vendor.sh
      - name: Freeze application and smoke-test native media input
        run: python packaging/build_bundle.py --vendor vendor
      - name: Start frozen app and check first-run authentication
        run: python packaging/smoke_desktop_bundle.py
      - name: Create Windows installer
        id: windows_installer
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          $version = python packaging/release.py version
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --version=6.5.4 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $compiler "/DAppVersion=$version" "/DAppArch=$env:APP_ARCH" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Installed Windows application stops before uninstall; data survives
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: ./packaging/smoke_windows_installer.ps1
      - name: Preserve built packages after an installer test failure
        if: ${{ failure() && steps.windows_installer.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-windows-${{ matrix.arch }}
          path: dist/FlintEye-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/FlintEye-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux:
    if: ${{ !inputs.crypto_only && !inputs.windows_stop_only && !inputs.desktop_only && !inputs.windows_arm_only && !inputs.windows_only }}
    needs: checks
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build on the minimum glibc baseline
        run: docker buildx build --build-arg "FLINTEYE_REVISION=$GITHUB_SHA" -f packaging/LinuxBuilder.Dockerfile --target artifacts --output type=local,dest=dist .
      - name: Install and start without Python, Node or Git
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version=$(python3 packaging/release.py version)
          docker build --build-arg "VERSION=$version" --build-arg "ARCH=$TARGET_ARCH" -f packaging/PackageCheck.Dockerfile -t flinteye:package-check dist
          docker run --rm -i --network none flinteye:package-check -s < packaging/smoke_bundle.sh
      - name: Install RPM and resolve runtime upgrades on Rocky 9
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version=$(python3 packaging/release.py version)
          docker build --build-arg "VERSION=$version" --build-arg "ARCH=$TARGET_ARCH" -f packaging/RPMCheck.Dockerfile -t flinteye:rpm-check dist
          docker run --rm -i --network none flinteye:rpm-check -s < packaging/smoke_bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist/FlintEye-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  containers:
    if: ${{ !inputs.crypto_only && !inputs.windows_stop_only && !inputs.desktop_only && !inputs.windows_arm_only && !inputs.windows_only }}
    needs: checks
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and test without publishing
        run: |
          version=$(python packaging/release.py version)
          image="flinteye:release-$TARGET_ARCH"
          docker buildx build --load --provenance=false --build-arg "FLINTEYE_VERSION=$version" --build-arg "FLINTEYE_REVISION=$GITHUB_SHA" -t "$image" .
          docker run --rm -i --network none --tmpfs /data:rw,uid=10001,gid=10001 --entrypoint python "$image" - < packaging/smoke_container.py
          docker run --rm -i --network none --entrypoint python "$image" - --mediamtx /opt/flinteye/bin/mediamtx < packaging/smoke_private_input.py
          mkdir -p artifacts source-output media-output
          docker run --rm --user 0 --entrypoint python -v "$PWD/source-output:/out" "$image" packaging/container_sources.py /out
          sudo chown -R "$(id -u):$(id -g)" source-output
          docker buildx build --target media-sources --output type=local,dest=media-output .
          mv source-output/container-sources.tar.gz "artifacts/FlintEye-$version-container-$TARGET_ARCH-sources.tar.gz"
          mv source-output/container-notices.tar.gz "artifacts/FlintEye-$version-container-$TARGET_ARCH-notices.tar.gz"
          mv media-output/media-source.tar.gz "artifacts/FlintEye-$version-container-$TARGET_ARCH-mediamtx-sources.tar.gz"
          docker save "$image" | gzip > "artifacts/container-$TARGET_ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-container-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  assemble:
    needs: [desktop, linux, containers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: build-artifacts
      - run: python packaging/release.py assemble --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
