# Development preview; requires the public GHCR version named below.
# No login is needed once public; see docs/DOCKER.md.
# For a source build, use deploy/compose.dev.yaml.
services:
  flinteye:
    image: ${FLINTEYE_IMAGE:-ghcr.io/noguhiro2002/flinteye:1.2.0-preview.7}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    # Linux only: preserves LAN ONVIF discovery and WebRTC ICE addresses.
    network_mode: host
    environment:
      FLINTEYE_LAN_ADDRESS: ${FLINTEYE_LAN_ADDRESS:-}
      FLINTEYE_LAN_SOURCES: ${FLINTEYE_LAN_SOURCES:-}
    volumes:
      - flinteye-data:/data
    # Optional USB camera; grant the host video group as well:
    # devices:
    #   - /dev/video0:/dev/video0
    #   - /dev/snd:/dev/snd  # Optional camera microphone
    # group_add:
    #   - "44"  # Replace with the host's video GID.
    #   - "29"  # Replace with the host's audio GID if using a microphone.
volumes:
  flinteye-data:
