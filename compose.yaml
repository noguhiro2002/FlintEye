# Planned public preview: available only after its GitHub Release is published.
# For a source build now, use deploy/compose.dev.yaml.
# Private testing image. Sign in to ghcr.io before pulling; see docs/DOCKER.md.
services:
  flinteye:
    image: ${FLINTEYE_IMAGE:-ghcr.io/noguhiro2002/flinteye:1.1.2-preview.1}
    init: true
    restart: unless-stopped
    # Linux only: preserves LAN ONVIF discovery and WebRTC ICE addresses.
    network_mode: host
    volumes:
      - flinteye-data:/data
    # Optional USB camera; grant the host video group as well:
    # devices:
    #   - /dev/video0:/dev/video0
    # group_add:
    #   - "44"  # Replace with the host's video GID.
volumes:
  flinteye-data:
